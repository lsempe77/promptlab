name: backend tests

on:
  push:
    paths: ['backend/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/tests.yml']

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
